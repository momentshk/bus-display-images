name: Update weather cover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-cover
  cancel-in-progress: true

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select cover image from HKO warnings
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en')"
          selected_image="UB-a-1.png"
          selected_rank=0

          consider() {
            local image="$1"
            local rank="$2"
            if (( rank > selected_rank )); then
              selected_image="$image"
              selected_rank="$rank"
            fi
          }

          tc_action="$(jq -r '.WTCSGNL.actionCode // ""' <<<"$response")"
          tc_code="$(jq -r '.WTCSGNL.code // ""' <<<"$response")"
          if [[ "$tc_action" != "CANCEL" ]]; then
            case "$tc_code" in
              TC1) consider "T1.png" 50 ;;
              TC3) consider "T3.png" 70 ;;
              TC8NE) consider "T8-NE.png" 100 ;;
              TC8NW) consider "T8-NW.png" 100 ;;
              TC8SE) consider "T8-SE.png" 100 ;;
              TC8SW) consider "T8-SW.png" 100 ;;
              TC9) consider "T9.png" 110 ;;
              TC10) consider "T10.png" 120 ;;
            esac
          fi

          rain_action="$(jq -r '.WRAIN.actionCode // ""' <<<"$response")"
          rain_code="$(jq -r '.WRAIN.code // ""' <<<"$response")"
          if [[ "$rain_action" != "CANCEL" ]]; then
            case "$rain_code" in
              WRAINA) consider "Amber.png" 60 ;;
              WRAINR) consider "Red.png" 80 ;;
              WRAINB) consider "Black.png" 90 ;;
            esac
          fi

          source="OTHER/$selected_image"
          target="OTHER/cover.png"
          test -f "$source"

          echo "HKO warning selection: $selected_image"
          if cmp --silent "$source" "$target"; then
            echo "cover.png is already up to date"
            exit 0
          fi

          cp "$source" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Update cover for HKO warning: $selected_image"
          git push
